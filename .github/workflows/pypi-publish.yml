name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile web-ui static bundle
        run: |
          if [ -d "web-ui" ]; then
            echo "Compiling web-ui static bundle from web-ui/ directory..."
            cd web-ui
            npm ci
            npm run build
            if [ -d "dist" ]; then
              mkdir -p ../src/trace_lite/ui/static
              cp -r dist/* ../src/trace_lite/ui/static/
            fi
            cd ..
          elif [ -f "package.json" ]; then
            echo "Compiling web-ui static bundle from root package.json..."
            npm ci
            npm run build
          else
            echo "No web-ui package.json found. Ensuring static UI directory exists."
            mkdir -p src/trace_lite/ui/static
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python wheel and sdist
        run: |
          python -m build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
