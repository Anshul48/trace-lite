name: Trace-Lite SOTA Benchmark & Release Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark-and-gates:
    name: Benchmark Suite & Gate Enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui,benchmark]"

      - name: Run Core Unit Tests
        run: |
          python -m pytest tests/

      - name: Run Benchmark Harness Tests
        run: |
          python -m pytest benchmarks/test_benchmark_harness.py

      - name: Execute Curated In-Domain Benchmark & Assert Release Gates
        run: |
          python -m benchmarks.runner run \
            --dataset benchmarks/datasets/trace_engineering_curated.json \
            --baselines bm25,dense,hybrid_rrf,flat_hierarchy,hipporag_ppr \
            --concurrency 4 \
            --format all \
            --assert-gate

      - name: Generate Standalone HTML Benchmark Report
        run: |
          LATEST_RUN=$(ls -t benchmarks/results/run_*.json | head -n 1)
          python -m benchmarks.runner report --run "$LATEST_RUN" --output benchmarks/results/ci_benchmark_report.html

      - name: Upload Benchmark Results & Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
