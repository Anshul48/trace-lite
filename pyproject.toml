[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-lite"
version = "0.2.0"
description = "High-performance single-node filing cabinet and local memory substrate"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
tl = "trace_lite.cli:app"
trace-lite = "trace_lite.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
