[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-lite"
version = "0.1.0"
description = "Source-first headless database with fail-closed hierarchical retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lancedb>=0.6.0",
    "sentence-transformers>=3.0.0",
    "litellm>=1.0.0",
    "hdbscan>=0.8.30",
    "umap-learn>=0.5.3",
    "numba>=0.59.0",
    "numpy>=1.24.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "keyring>=25.0.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/trace-lite/trace-lite"
Documentation = "https://github.com/trace-lite/trace-lite#readme"
Repository = "https://github.com/trace-lite/trace-lite.git"
Issues = "https://github.com/trace-lite/trace-lite/issues"


[project.scripts]
trace-lite = "trace_lite.cli:main"
tracel = "trace_lite.cli:main"
tl = "trace_lite.cli:main"

[project.optional-dependencies]
ui = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "httpx",
]

[tool.setuptools.package-data]
"trace_lite" = ["models.json"]
"trace_lite.ui" = ["static/*", "static/**/*"]
